services:
  backend:
    build:
      dockerfile: ./backend/Dockerfile
      context: .
    ports:
      - "8000:8000"
    networks:
      - net

  frontend:
    build:
      dockerfile: ./frontend/Dockerfile
      context: .
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    networks:
      - net

networks:
  net:
    driver: bridge
